[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniplan-mcp"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = ["mcp[cli]"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
omniplan-mcp = "omniplan_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "requires_omniplan: integration test that needs OmniPlan running with a document open",
]
